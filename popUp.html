<html>
<html>
<head>
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
        }
        h2 {
            margin-top: 0;
            text-align: center;
        }
        .speed-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }
        .speed-row label {
            font-size: 16px;
        }
        .speed-row input {
            width: 80px;
            padding: 8px;
            font-size: 14px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #cc0000;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #ff0000;
        }
        .saved {
            text-align: center;
            color: #4CAF50;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h2>Customize Speeds</h2>
    
    <div class="speed-row">
        <label>Speed 1</label>
        <input type="number" id="speed1" step="0.1" min="0.1" max="16" value="0.5">
    </div>
    
    <div class="speed-row">
        <label>Speed 2</label>
        <input type="number" id="speed2" step="0.1" min="0.1" max="16" value="3">
    </div>
    
    <div class="speed-row">
        <label>Speed 3</label>
        <input type="number" id="speed3" step="0.1" min="0.1" max="16" value="4">
    </div>
    
    <div class="speed-row">
        <label>Speed 4</label>
        <input type="number" id="speed4" step="0.1" min="0.1" max="16" value="5">
    </div>
    
    <button id="save">Save Settings</button>
    <div id="saved-message" class="saved" style="display: none;">Saved! Refresh YouTube to apply.</div>
    
    <script src="popup.js"></script>
</body>
</html>
